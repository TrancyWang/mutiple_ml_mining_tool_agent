name: Build Academic Agent for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Create Windows icon
        shell: pwsh
        run: python scripts/create_windows_icon.py

      - name: Build executable
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          $env:PYINSTALLER_CONFIG_DIR = "$PWD\.pyinstaller"
          $env:MPLCONFIGDIR = "$PWD\.build_cache\matplotlib"
          New-Item -ItemType Directory -Force -Path $env:PYINSTALLER_CONFIG_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:MPLCONFIGDIR | Out-Null
          python -m PyInstaller --clean --noconfirm AcademicAgent.windows.spec
          Copy-Item .env.example dist\AcademicAgent\.env.example -Force
          Compress-Archive -Path dist\AcademicAgent -DestinationPath dist\AcademicAgent-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcademicAgent-windows-${{ github.ref_name }}
          path: dist/AcademicAgent-windows.zip
          if-no-files-found: error
